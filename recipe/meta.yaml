{% set version = "2.0.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-estimability
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/estimability_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/estimability/estimability_{{ version }}.tar.gz
  sha256: 4db3ed64e7a1b7234aed72ccc2c02590377b2234edb4ba282eefffb850838a66

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('estimability')"           # [not win]
    - "\"%R%\" -e \"library('estimability')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=estimability
  license: GPL-3.0-or-later
  summary: Provides tools for determining estimability of linear functions  of regression coefficients, and 'epredict' methods that handle  non-estimable cases correctly. Estimability theory is discussed in many linear-models textbooks including Chapter 3 of Monahan, JF (2008),  "A Primer on Linear Models", Chapman and
    Hall (ISBN 978-1-4200-6201-4).
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
